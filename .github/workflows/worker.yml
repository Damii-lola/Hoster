name: Hoster Worker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-qwen2.5-7b-instruct-q4km-v1

      - name: Run worker
        env:
          TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
          WORKER_ID: "gha-worker-1"
          MAX_RUNTIME_SECONDS: "17700"
        run: python worker/worker.py
