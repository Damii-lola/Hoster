name: Hoster Worker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"   # safety net only now — see "Schedule next run" step below for the real coverage

permissions:
  actions: write   # required so this run can trigger the next one
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5 hours — safely under GitHub's 6-hour hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-qwen2.5-7b-instruct-q4km-v1

      - name: Run worker
        env:
          TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
          WORKER_ID: "gha-worker-1"
          MAX_RUNTIME_SECONDS: "17700"
        run: python worker/worker.py

      - name: Schedule next run in 2 minutes
        if: always()           # runs even if the worker step above crashed, so the chain never just dies
        continue-on-error: true  # a scheduling failure shouldn't paint this whole run red
        run: |
          echo "Waiting 2 minutes before triggering the next run..."
          sleep 120
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/worker.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
