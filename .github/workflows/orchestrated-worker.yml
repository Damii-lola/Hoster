name: Hoster Orchestrated Worker

# Launched by the orchestrator (orchestrator.yml), never by a human
# directly in normal operation — though workflow_dispatch with manual
# inputs works fine for testing this in isolation too.
#
# Each dispatch of this workflow is its OWN independent run (not a
# matrix), specifically so the orchestrator can cancel exactly one
# worker later via "cancel a workflow run" — which works per-run, even
# though per-job cancellation inside a shared matrix does not (verified
# during Phase 2B).

on:
  workflow_dispatch:
    inputs:
      worker_id:
        required: true
        type: string
      model_repo:
        required: true
        type: string
      model_file:
        required: true
        type: string
      model_name:
        required: true
        type: string
      max_runtime_seconds:
        required: false
        type: string
        default: "1500"   # orchestrated workers run shorter cycles than the baseline worker; the orchestrator re-evaluates and relaunches as needed

run-name: "Worker ${{ inputs.worker_id }} (${{ inputs.model_name }})"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ inputs.model_file }}-v1

      - name: Run worker (${{ inputs.worker_id }})
        env:
          TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
          WORKER_ID: ${{ inputs.worker_id }}
          MODEL_REPO: ${{ inputs.model_repo }}
          MODEL_FILE: ${{ inputs.model_file }}
          MODEL_NAME: ${{ inputs.model_name }}
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds }}
        run: python worker/worker.py
