services:
  - type: web
    name: hoster-api
    env: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --chdir api app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: TIDB_CONNECTION_STRING
        sync: false   # paste the full string from TiDB Cloud's "Connect" panel
